<!DOCTYPE html>
<html>
<head>
    <title>Manhunt | The Secret Chamber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Page content */
        .content {
            position: relative;
            z-index: 1;
        }

        /* Puzzle container */
        .puzzle-container {
            width: 360px;
            height: 360px;
            margin: 30px auto;
            position: relative;
            border: 3px solid #39ff14;
            box-shadow: 0 0 30px #39ff14;
            background-color: #050505;
        }

        /* Individual tiles */
        .tile {
            width: 120px;
            height: 120px;
            position: absolute;
            border: 2px solid #050505;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Creepster', cursive;
            font-size: 2.5em;
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14;
            background-color: #0d1f0d;
            box-sizing: border-box;
            user-select: none;
        }

        /* Empty tile */
        .tile.empty {
            background-color: #050505;
            cursor: default;
            color: transparent;
        }

        /* Tile hover effect */
        .tile:not(.empty):hover {
            background-color: #1a3d1a;
            box-shadow: inset 0 0 15px #39ff14;
        }

        /* Moves counter */
        .moves {
            font-family: 'Creepster', cursive;
            font-size: 1.2em;
            color: #1a8c00;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        /* Secret code reveal box */
        #codeReveal {
            display: none;
            border: 2px solid #39ff14;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: rgba(0, 0, 0, 0.7);
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Secret code text */
        .secret-code {
            font-family: 'Creepster', cursive;
            font-size: 2.5em;
            color: #39ff14;
            text-shadow: 0 0 20px #39ff14, 0 0 40px #39ff14;
            letter-spacing: 8px;
            margin: 20px 0;
        }

        /* Shuffle button */
        .shuffle-btn {
            background: transparent;
            border: 1px solid #1a8c00;
            color: #1a8c00;
            font-family: 'Creepster', cursive;
            font-size: 1em;
            padding: 8px 20px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
        }

        .shuffle-btn:hover {
            background-color: #1a8c00;
            color: #050505;
        }

        /* Win message */
        #winMessage {
            display: none;
            font-family: 'Creepster', cursive;
            font-size: 1.3em;
            color: #39ff14;
            text-shadow: 0 0 15px #39ff14;
            animation: fadeIn 1s ease;
        }
    </style>
</head>

<body>
    <div class="content">

        <h1>🗝️ The Secret Chamber</h1>
        <p>The map has been shattered into pieces.<br>
        Only the worthy can restore it. 😈</p>

       <!-- Goal preview — top right corner -->
        <div style="position: fixed; top: 20px; right: 20px; z-index: 999;">
            <p style="font-family:'Creepster',cursive; color:#1a8c00; 
            font-size:0.8em; margin-bottom:5px; letter-spacing:1px;">
                🗺️ Your goal:
            </p>
            <!-- Mini solved puzzle -->
            <div style="display:grid; grid-template-columns: repeat(3, 40px); 
            gap:2px; border: 1px solid #1a8c00; padding:4px;
            background-color:rgba(0,0,0,0.8);">
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">🌲</div>
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">💀</div>
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">🕷️</div>
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">🗺️</div>
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">🌑</div>
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">👻</div>
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">🦴</div>
                <div style="width:40px;height:40px;background:#0d1f0d;
                display:flex;align-items:center;justify-content:center;font-size:1.2em;">🔐</div>
                <div style="width:40px;height:40px;background:#050505;
                border:1px dashed #1a8c00;"></div>
            </div>
        </div>

        <!-- Moves counter -->
        <p class="moves" id="movesCounter">🦴 Moves made: 0</p>

        <!-- Shuffle and hint buttons -->
        <button class="shuffle-btn" onclick="shuffleTiles()">🔀 Reshuffle the bones</button>
        <button class="shuffle-btn" onclick="showHint()">💡 I need a hint...</button>

        <!-- Hint text — hidden by default -->
        <p id="puzzleHint" style="display:none; font-family:'Creepster',cursive; 
        font-size:1em; color:#1a8c00; font-style:italic; 
        margin:10px 0; letter-spacing:1px;"></p>

        <!-- The sliding puzzle grid -->
        <div class="puzzle-container" id="puzzleGrid"></div>

        <!-- Win message -->
        <p id="winMessage">
            ✅ The forest did NOT see that coming. 😈
        </p>

        <!-- Secret code reveal -->
      <p style="font-family:'Creepster',cursive; font-size:1.2em; color:#1a8c00;">
                Take this code to the codex. It knows what to do. 🔐
            </p>

            <!-- The secret code -->
            <div class="secret-code">MANHUNT-XIII</div>

            <p style="font-family:'Creepster',cursive; font-size:1em; color:#1a8c00;">
                Guard it with your life. 🗺️
            </p>

            <a href="/codex">
                <button>🔐 Enter the Codex</button>
            </a>
        </div>

        <br>
        <a href="/"><button>⬅️ Flee back to safety</button></a>

    </div>
</body>

<script>
    // The solved state — numbers 1-8 then 0 (empty)
    const SOLVED = [1, 2, 3, 4, 5, 6, 7, 8, 0];

    // Emoji icons for each tile — spooky forest themed
    const TILE_ICONS = {
        1: '🌲', 2: '💀', 3: '🕷️',
        4: '🗺️', 5: '🌑', 6: '👻',
        7: '🦴', 8: '🔐', 0: ''
    };

    let tiles = [];
    let moves = 0;

    // Initialize the puzzle
    function initPuzzle() {
        tiles = [...SOLVED];
        shuffleTiles();
    }

    // Shuffle tiles into a solvable state
    function shuffleTiles() {
        moves = 0;
        updateMovesCounter();
        document.getElementById('winMessage').style.display = 'none';
        document.getElementById('codeReveal').style.display = 'none';

        // Shuffle by making random valid moves
        tiles = [...SOLVED];
        for (let i = 0; i < 200; i++) {
            const emptyIndex = tiles.indexOf(0);
            const neighbors = getNeighbors(emptyIndex);
            const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
            // Swap empty with random neighbor
            [tiles[emptyIndex], tiles[randomNeighbor]] = [tiles[randomNeighbor], tiles[emptyIndex]];
        }
        renderGrid();
    }

    // Get valid neighboring tiles that can move into empty space
    function getNeighbors(index) {
        const neighbors = [];
        const row = Math.floor(index / 3);
        const col = index % 3;

        // Up
        if (row > 0) neighbors.push(index - 3);
        // Down
        if (row < 2) neighbors.push(index + 3);
        // Left
        if (col > 0) neighbors.push(index - 1);
        // Right
        if (col < 2) neighbors.push(index + 1);

        return neighbors;
    }

    // Render the grid
    function renderGrid() {
        const grid = document.getElementById('puzzleGrid');
        grid.innerHTML = '';

        tiles.forEach((tile, index) => {
            const div = document.createElement('div');
            div.className = 'tile' + (tile === 0 ? ' empty' : '');

            // Position tile in grid
            const row = Math.floor(index / 3);
            const col = index % 3;
            div.style.top = (row * 120) + 'px';
            div.style.left = (col * 120) + 'px';

            // Add icon
            div.innerHTML = TILE_ICONS[tile];

            // Click handler
            if (tile !== 0) {
                div.onclick = () => moveTile(index);
            }

            grid.appendChild(div);
        });
    }

    // Move a tile into the empty space
    function moveTile(index) {
        const emptyIndex = tiles.indexOf(0);
        const neighbors = getNeighbors(emptyIndex);

        // Only move if tile is next to empty space
        if (neighbors.includes(index)) {
            [tiles[emptyIndex], tiles[index]] = [tiles[index], tiles[emptyIndex]];
            moves++;
            updateMovesCounter();
            renderGrid();
            checkWin();
        }
    }

    // Update moves counter
    function updateMovesCounter() {
        const messages = [
            `🦴 Moves made: ${moves}`,
            `💀 Moves made: ${moves} — The forest is judging you.`,
            `😈 Moves made: ${moves} — Are you lost?`,
        ];
        const msg = moves < 10 ? messages[0] : moves < 25 ? messages[1] : messages[2];
        document.getElementById('movesCounter').innerHTML = msg;
    }

    // Check if puzzle is solved
    function checkWin() {
        if (JSON.stringify(tiles) === JSON.stringify(SOLVED)) {
            // Show win message
            document.getElementById('winMessage').style.display = 'block';
            // Reveal secret code after short delay
            setTimeout(() => {
                document.getElementById('codeReveal').style.display = 'block';
                document.getElementById('codeReveal').scrollIntoView({ behavior: 'smooth' });
            }, 2000);
        }
    }

    // Start the puzzle on page load
    initPuzzle();
    // Hint system — vague but playful
    let hintLevel = 0;
    const hints = [
        "🌑 The empty space is your only friend in this forest. Use it wisely.",
        "💀 Corners are stubborn. Don't fight them — work around them.",
        "😈 The top row bows to no one. Tame it first or suffer the consequences.",
    ];

    function showHint() {
        const hintEl = document.getElementById('puzzleHint');
        hintEl.style.display = 'block';
        hintEl.innerHTML = hints[hintLevel % hints.length];
        hintLevel++;
    }
</script>

</html>
