<!DOCTYPE html>
<!-- This tells the browser: "Hey, this is an HTML file" -->

<html>
<!-- Everything in your webpage lives inside these html tags -->

<head>
    <!-- The head is invisible to visitors — it holds background info about the page -->
    <title>Where's My Johnny</title>
    <!-- This is the text that appears on the browser tab -->
</head>

<body>
    <!-- Everything inside body is what visitors actually SEE on the page -->

    <h1>🌲 Welcome to the Puzzle Forest</h1>
    <!-- h1 = the biggest heading on the page, like a title -->

    <p>Your quest begins here...</p>
    <!-- p = a paragraph of text -->

</body>

</html>
