<!DOCTYPE html>
<html>
<head>
    <title>Manhunt | The Codex</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .content {
            position: relative;
            z-index: 1;
        }

        /* Code input box */
        .codex-box {
            border: 2px solid #2db30f;
            max-width: 500px;
            margin: 30px auto;
            padding: 25px;
            background-color: rgba(0, 0, 0, 0.7);
        }

        /* Code input field */
        .code-input {
            background: transparent;
            border: 2px solid #2db30f;
            color: #2db30f;
            padding: 12px;
            font-size: 1.5em;
            width: 70%;
            text-align: center;
            font-family: 'Creepster', cursive;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        /* Feedback */
        #feedback {
            font-family: 'Creepster', cursive;
            font-size: 1.2em;
            margin-top: 15px;
            letter-spacing: 2px;
        }

        /* Attempts counter */
        .attempts {
            font-family: 'Creepster', cursive;
            font-size: 0.9em;
            color: #1a8c00;
            margin-top: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div class="content">

        <h1>🔐 The Codex</h1>

        <p>The codex hums ominously.<br>
        It has been waiting. Unlike you, it is patient. 😈</p>

        <div class="codex-box">

            <p style="font-family:'Creepster',cursive; font-size:1.2em; color:#2db30f;">
                Enter the code from the restored map:
            </p>

            <!-- Code input -->
            <input
                type="text"
                id="codeInput"
                class="code-input"
                placeholder="XXXXX-XXX"
                maxlength="12">

            <br><br>
            <button onclick="checkCode()">🔐 Submit Code</button>

            <!-- Feedback -->
            <p id="feedback"></p>

            <!-- Attempts counter -->
            <p class="attempts" id="attemptsText"></p>

        </div>

        <br>
        <a href="/"><button>⬅️ Flee back to safety</button></a>

    </div>
</body>

<script>
    let attempts = 0;

    function checkCode() {
        const code = document.getElementById('codeInput').value.toUpperCase().trim();
        const feedback = document.getElementById('feedback');
        const attemptsText = document.getElementById('attemptsText');

        if (code === 'MANHUNT-XIII') {
            feedback.style.color = '#2db30f';
            feedback.innerHTML = '✅ The codex shudders. The forest exhales. You figured it out. Disgusting. We are proud. 😈';
            // Redirect to victory page after short delay
            setTimeout(() => {
                window.location.href = '/victory';
            }, 2500);
        } else {
            attempts++;
            const failMessages = [
                "❌ The codex stares at you blankly. Wrong. 🔐",
                "❌ Still wrong. Did you even write it down? 😈",
                "❌ The codex is considering retirement because of you. 💀",
                "❌ Wrong again. The criminal is laughing at you from his cell. 😈",
            ];
            feedback.style.color = '#8b0000';
            feedback.innerHTML = failMessages[Math.min(attempts - 1, 3)];
            attemptsText.innerHTML = `💀 Failed attempts: ${attempts} — The forest remembers.`;
        }
    }

    // Allow pressing Enter to submit
    document.getElementById('codeInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkCode();
    });
</script>

</html>
